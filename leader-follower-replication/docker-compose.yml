# ─────────────────────────────────────────────────────────────
# Cluster 4 — Leaderless  W=5, R=1  (ports 8040-8044)
# ─────────────────────────────────────────────────────────────
  ll-n0:
    <<: *node
    ports: ["8040:5000"]
    environment:
      NODE_ID: "0"
      NODE_ROLE: leaderless
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      PEER_URLS: "http://ll-n1:5000,http://ll-n2:5000,http://ll-n3:5000,http://ll-n4:5000"

  ll-n1:
    <<: *node
    ports: ["8041:5000"]
    environment:
      NODE_ID: "1"
      NODE_ROLE: leaderless
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      PEER_URLS: "http://ll-n0:5000,http://ll-n2:5000,http://ll-n3:5000,http://ll-n4:5000"

  ll-n2:
    <<: *node
    ports: ["8042:5000"]
    environment:
      NODE_ID: "2"
      NODE_ROLE: leaderless
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      PEER_URLS: "http://ll-n0:5000,http://ll-n1:5000,http://ll-n3:5000,http://ll-n4:5000"

  ll-n3:
    <<: *node
    ports: ["8043:5000"]
    environment:
      NODE_ID: "3"
      NODE_ROLE: leaderless
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      PEER_URLS: "http://ll-n0:5000,http://ll-n1:5000,http://ll-n2:5000,http://ll-n4:5000"

  ll-n4:
