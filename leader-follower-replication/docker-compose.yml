    <<: *node
    ports: ["8030:5000"]
    environment:
      NODE_ID: "0"
      NODE_ROLE: leader
      WRITE_QUORUM: "3"
      READ_QUORUM: "3"
      PEER_URLS: "http://lf3-n1:5000,http://lf3-n2:5000,http://lf3-n3:5000,http://lf3-n4:5000"

  lf3-n1:
    <<: *node
    ports: ["8031:5000"]
    environment:
      NODE_ID: "1"
      NODE_ROLE: follower
      WRITE_QUORUM: "3"
      READ_QUORUM: "3"
      LEADER_URL: "http://lf3-leader:5000"

  lf3-n2:
    <<: *node
    ports: ["8032:5000"]
    environment:
      NODE_ID: "2"
      NODE_ROLE: follower
      WRITE_QUORUM: "3"
      READ_QUORUM: "3"
