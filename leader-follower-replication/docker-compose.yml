version: "3.9"

# Build context is the repo root so the Go module is available.
x-node: &node
  build:
    context: .
    dockerfile: node/Dockerfile
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s
  restart: unless-stopped
  networks:
    - kv-net

# ─────────────────────────────────────────────────────────────
# Cluster 1 — Leader-Follower  W=5, R=1  (ports 8010-8014)
# ─────────────────────────────────────────────────────────────
services:
  lf1-leader:
    <<: *node
    ports: ["8010:5000"]
    environment:
      NODE_ID: "0"
      NODE_ROLE: leader
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      PEER_URLS: "http://lf1-n1:5000,http://lf1-n2:5000,http://lf1-n3:5000,http://lf1-n4:5000"

  lf1-n1:
    <<: *node
    ports: ["8011:5000"]
    environment:
      NODE_ID: "1"
      NODE_ROLE: follower
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      LEADER_URL: "http://lf1-leader:5000"

  lf1-n2:
    <<: *node
    ports: ["8012:5000"]
    environment:
      NODE_ID: "2"
      NODE_ROLE: follower
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      LEADER_URL: "http://lf1-leader:5000"

  lf1-n3:
    <<: *node
    ports: ["8013:5000"]
    environment:
      NODE_ID: "3"
      NODE_ROLE: follower
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      LEADER_URL: "http://lf1-leader:5000"

  lf1-n4:
    <<: *node
    ports: ["8014:5000"]
    environment:
      NODE_ID: "4"
      NODE_ROLE: follower
      WRITE_QUORUM: "5"
      READ_QUORUM: "1"
      LEADER_URL: "http://lf1-leader:5000"

# ─────────────────────────────────────────────────────────────
# Cluster 2 — Leader-Follower  W=1, R=5  (ports 8020-8024)
# ─────────────────────────────────────────────────────────────
  lf2-leader:
    <<: *node
    ports: ["8020:5000"]
    environment:
      NODE_ID: "0"
      NODE_ROLE: leader
      WRITE_QUORUM: "1"
      READ_QUORUM: "5"
      PEER_URLS: "http://lf2-n1:5000,http://lf2-n2:5000,http://lf2-n3:5000,http://lf2-n4:5000"

  lf2-n1:
    <<: *node
    ports: ["8021:5000"]
    environment:
      NODE_ID: "1"
      NODE_ROLE: follower
      WRITE_QUORUM: "1"
      READ_QUORUM: "5"
      LEADER_URL: "http://lf2-leader:5000"

  lf2-n2:
    <<: *node
    ports: ["8022:5000"]
    environment:
      NODE_ID: "2"
      NODE_ROLE: follower
      WRITE_QUORUM: "1"
      READ_QUORUM: "5"
      LEADER_URL: "http://lf2-leader:5000"

  lf2-n3:
    <<: *node
    ports: ["8023:5000"]
    environment:
      NODE_ID: "3"
      NODE_ROLE: follower
      WRITE_QUORUM: "1"
      READ_QUORUM: "5"
      LEADER_URL: "http://lf2-leader:5000"

  lf2-n4:
    <<: *node
